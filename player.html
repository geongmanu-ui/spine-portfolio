<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spine Player</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@esotericsoftware/spine-player@4.2/dist/iife/spine-player.css">
<script src="https://cdn.jsdelivr.net/npm/@esotericsoftware/spine-player@4.2/dist/iife/spine-player.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: transparent; overflow: hidden; width: 100vw; height: 100vh; }
#container { width: 100%; height: 100%; }
.spine-player { width: 100% !important; height: 100% !important; }
.spine-player-controls, .spine-player-hover { display: none !important; }
#err { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: #e74c3c; font: 14px sans-serif; text-align: center; }
</style>
</head>
<body>
<div id="container"></div>
<div id="err"></div>
<script>
var p = new URLSearchParams(window.location.search);
var name = p.get("name") || "";
var anim = p.get("anim") || "";
var bg = p.get("bg") || "00000000";

if (!name) {
    document.getElementById("err").style.display = "block";
    document.getElementById("err").textContent = "URL에 ?name=폴더명 이 필요합니다.";
} else {
    new spine.SpinePlayer("container", {
        jsonUrl: name + "/" + name + ".json",
        atlasUrl: name + "/" + name + ".atlas.txt",
        animation: anim || undefined,
        backgroundColor: "#" + bg,
        premultipliedAlpha: true,
        showControls: false,
        showLoading: true,
        fitToCanvas: true,
        success: function(player) {
            var anims = player.skeleton.data.animations;
            if (anims.length === 0) return;

            if (anim) {
                player.animationState.setAnimation(0, anim, true);
                return;
            }

            var currentIndex = 0;
            player.animationState.setAnimation(0, anims[0].name, false);

            player.animationState.addListener({
                complete: function(entry) {
                    currentIndex = (currentIndex + 1) % anims.length;
                    player.animationState.setAnimation(0, anims[currentIndex].name, false);
                }
            });
        },
        error: function(player, msg) {
            document.getElementById("err").style.display = "block";
            document.getElementById("err").textContent = "로드 실패: " + msg;
        }
    });
}
</script>
</body>
</html>
