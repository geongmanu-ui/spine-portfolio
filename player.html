<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spine Animation Player</title>

    <!-- ============================================================
         ★ Spine 버전 설정 ★
         본인의 Spine 버전에 맞게 아래 버전 번호를 변경하세요.
         - Spine 4.2 → "4.2"
         - Spine 4.1 → "4.1"  
         - Spine 3.8 → "3.8"
    ============================================================ -->
    <script>
        const SPINE_VERSION = "4.2";
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #player-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Pretendard', sans-serif;
            color: #888;
            font-size: 14px;
        }

        #error {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Pretendard', sans-serif;
            color: #e74c3c;
            font-size: 14px;
            text-align: center;
            padding: 20px;
        }

        /* spine-player 위젯 스타일 덮어쓰기 (컨트롤 숨기기용) */
        .spine-player-controls,
        .spine-player-hover {
            display: none !important;
        }

        .spine-player {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body>

<div id="player-container">
    <div id="loading">로딩 중...</div>
    <div id="error"></div>
</div>

<script>
/**
 * ============================================================
 * URL 파라미터 설명:
 * 
 *   ?name=캐릭터폴더명       (필수) 루트의 폴더명
 *   &anim=애니메이션이름      (선택) 재생할 애니메이션 (기본: 첫 번째)
 *   &skin=스킨이름           (선택) 적용할 스킨 (기본: default)
 *   &loop=true              (선택) 반복 재생 여부 (기본: true)
 *   &bg=00000000            (선택) 배경색 hex (기본: 투명)
 *   &controls=true          (선택) 컨트롤 표시 여부 (기본: false)
 *   &scale=1                (선택) 스케일 (기본: 1)
 * 
 * 사용 예시:
 *   player.html?name=hero&anim=idle&loop=true
 *   player.html?name=monster&anim=attack&skin=red&bg=1a1a2e
 * ============================================================
 */

const params = new URLSearchParams(window.location.search);
const config = {
    name:     params.get('name')     || '',
    anim:     params.get('anim')     || '',
    skin:     params.get('skin')     || 'default',
    loop:     params.get('loop')     !== 'false',
    bg:       params.get('bg')       || '00000000',
    controls: params.get('controls') === 'true',
    scale:    parseFloat(params.get('scale') || '1'),
};

const loadingEl = document.getElementById('loading');
const errorEl   = document.getElementById('error');

function showError(msg) {
    loadingEl.style.display = 'none';
    errorEl.style.display   = 'block';
    errorEl.textContent     = msg;
}

if (!config.name) {
    showError('URL에 ?name=폴더명 파라미터가 필요합니다.');
} else {
    // Spine Player CSS & JS 동적 로드
    const cssLink = document.createElement('link');
    cssLink.rel  = 'stylesheet';
    cssLink.href = `https://unpkg.com/@esotericsoftware/spine-player@${SPINE_VERSION}/dist/iife/spine-player.css`;
    document.head.appendChild(cssLink);

    const script  = document.createElement('script');
    script.src    = `https://unpkg.com/@esotericsoftware/spine-player@${SPINE_VERSION}/dist/iife/spine-player.js`;
    script.onload = initPlayer;
    script.onerror = () => {
        // 버전별 fallback 시도
        const fallbackScript = document.createElement('script');
        fallbackScript.src = `https://unpkg.com/@esotericsoftware/spine-player/dist/iife/spine-player.js`;
        fallbackScript.onload = initPlayer;
        fallbackScript.onerror = () => showError(`Spine 런타임(v${SPINE_VERSION})을 로드할 수 없습니다.\n버전을 확인해주세요.`);
        document.head.appendChild(fallbackScript);
    };
    document.head.appendChild(script);
}

function initPlayer() {
    loadingEl.style.display = 'none';

    const container = document.getElementById('player-container');

    try {
        new spine.SpinePlayer(container, {
            jsonUrl:            `${config.name}/${config.name}.json`,
            atlasUrl:           `${config.name}/${config.name}.atlas`,
            animation:          config.anim || undefined,
            defaultMix:         0.2,
            skin:               config.skin,
            backgroundColor:    `#${config.bg}`,
            premultipliedAlpha: true,
            showControls:       config.controls ? "true" : "false",
            showLoading:        false,
            fitToCanvas:        true,
            success: function(player) {
                // 지정된 애니메이션이 없으면 첫 번째 애니메이션 자동 재생
                if (!config.anim) {
                    const animations = player.skeleton.data.animations;
                    if (animations.length > 0) {
                        player.animationState.setAnimation(0, animations[0].name, config.loop);
                    }
                }
            },
            error: function(player, msg) {
                showError(`애니메이션 로드 실패: ${msg}\n\n파일 경로를 확인해주세요:\n${config.name}/${config.name}.json\n${config.name}/${config.name}.atlas`);
            }
        });
    } catch (e) {
        showError(`플레이어 초기화 실패: ${e.message}`);
    }
}
</script>

</body>
</html>
