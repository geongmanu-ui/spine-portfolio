<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spine Animation Gallery</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Pretendard', sans-serif;
            background: #0f0f13;
            color: #e0e0e0;
            min-height: 100vh;
        }
        header { padding: 48px 32px 24px; text-align: center; }
        header h1 { font-size: 28px; font-weight: 700; color: #fff; }
        header p { margin-top: 8px; font-size: 14px; color: #888; }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 24px; padding: 24px 32px 64px;
            max-width: 1200px; margin: 0 auto;
        }
        .card {
            background: #1a1a22; border-radius: 12px;
            overflow: hidden; border: 1px solid #2a2a35;
            transition: border-color 0.2s;
        }
        .card:hover { border-color: #4a4a5a; }
        .card iframe { width: 100%; height: 320px; border: none; display: block; }
        .card-info { padding: 16px 20px; }
        .card-info h3 { font-size: 16px; font-weight: 600; color: #fff; }
        .card-info p { font-size: 13px; color: #888; margin-top: 4px; }
    </style>
</head>
<body>
<header>
    <h1>Spine Animation Gallery</h1>
    <p>포트폴리오 스파인 애니메이션 모음</p>
</header>

<!--
============================================================
★ 애니메이션 카드 추가 방법 ★

아래 gallery 안에 카드를 복사-붙여넣기 해서 추가하세요.
iframe src의 ?name= 값을 animations/ 폴더명과 맞추면 됩니다.

예시: animations/hero/ 폴더 → ?name=hero
============================================================
-->

<div class="gallery">

    <!-- ===== 아래 카드를 복사해서 사용하세요 ===== -->
    <!--
    <div class="card">
        <iframe src="player.html?name=폴더명&anim=idle&bg=1a1a22" loading="lazy"></iframe>
        <div class="card-info">
            <h3>캐릭터 이름</h3>
            <p>설명</p>
        </div>
    </div>
    -->

</div>
</body>
</html>
